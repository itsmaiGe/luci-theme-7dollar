# Builds the OpenWrt 25.x (.apk) package inside an official OpenWrt 25.12 image,
# installs and removes it on a clean one, commits it to dist/, and publishes a
# GitHub Release with the ipk and apk the first time a version reaches main.
name: apk
on:
  push:
    paths: [ Makefile, 'htdocs/**', 'ucode/**', 'root/**', 'scripts/**', '.github/workflows/apk.yml' ]
  workflow_dispatch:
permissions:
  contents: write
env:
  IMG: openwrt/rootfs:x86-64-openwrt-25.12
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - name: Build
        run: |
          curl -fsSL https://dl-cdn.alpinelinux.org/alpine/v3.23/main/x86_64/apk-tools-static-3.0.8-r0.apk | tar -xz sbin/apk.static
          sudo APK=$PWD/sbin/apk.static sh scripts/build-apk.sh
          sudo chown -R "$(id -u):$(id -g)" dist
      - name: Install, check, remove
        run: |
          docker run --rm -i -v "$PWD/dist:/dist:ro" $IMG sh -eux <<'SH'
            mkdir -p /var/lock /var/run /tmp
            apk update && apk add luci-base
            mkdir -p /www/luci-static/7dollar && echo stale > /www/luci-static/7dollar/cascade.css  # left by the old copy installer
            apk add --allow-untrusted /dist/$(cat /dist/latest-apk.txt)
            test "$(wc -c < /www/luci-static/7dollar/cascade.css)" -gt 1000
            test -s /usr/share/ucode/luci/template/themes/7dollar/header.ut
            test "$(uci get luci.main.mediaurlbase)" = /luci-static/7dollar
            # the dashboard reads these through rpcd, which checks the ACL against the resolved path on 25.x
            apk add uhttpd uhttpd-mod-ubus >/dev/null
            printf "pw\npw\n" | passwd root >/dev/null
            ubusd & sleep 1; rpcd & sleep 1; uhttpd -p 127.0.0.1:8080 -h /www -u /ubus; sleep 1
            rpc() { wget -qO- --post-data "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"call\",\"params\":$1}" http://127.0.0.1:8080/ubus; }
            S=$(rpc '["00000000000000000000000000000000","session","login",{"username":"root","password":"pw"}]' | jsonfilter -e '@.result[1].ubus_rpc_session')
            for f in /proc/stat /proc/net/dev /proc/net/route /proc/net/arp; do
              rpc "[\"$S\",\"file\",\"read\",{\"path\":\"$f\"}]" | grep -q '"result":\[0,' || { echo "denied: $f"; exit 1; }
            done
            for f in /sys/devices/virtual/thermal/thermal_zone0/temp /sys/devices/platform/coretemp.0/hwmon/hwmon1/temp1_input /sys/devices/virtual/net/br-lan/brforward; do
              ubus call session access "{\"ubus_rpc_session\":\"$S\",\"scope\":\"file\",\"object\":\"$f\",\"function\":\"read\"}" | grep -q true || { echo "denied: $f"; exit 1; }
            done
            apk del luci-theme-7dollar
            test ! -e /www/luci-static/7dollar
            test "$(uci get luci.main.mediaurlbase)" = /luci-static/bootstrap
          SH
      - name: Commit
        if: github.ref == 'refs/heads/main'
        run: |
          git add -A dist
          git diff --cached --quiet && exit 0
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "dist: $(cat dist/latest-apk.txt)"
          git push
      - name: Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          v=$(sed -n 's/^PKG_VERSION:=//p' Makefile)
          gh release view "v$v" >/dev/null 2>&1 && exit 0
          ipk=dist/$(cat dist/latest.txt) apk=dist/$(cat dist/latest-apk.txt)
          case "$ipk $apk" in *"_$v-"*"-$v-"*) ;; *) echo "dist/ is not $v yet"; exit 0 ;; esac
          { git log -1 --format=%s -S"PKG_VERSION:=$v" -- Makefile | sed "s/^$v: //"; echo
            echo "23.05 / 24.10 用 ipk，25.x 用 apk。安装方法见 [README](https://github.com/$GITHUB_REPOSITORY#安装)。"; } > notes.md
          gh release create "v$v" "$ipk" "$apk" --title "7Dollar $v" --notes-file notes.md --target "$(git rev-parse HEAD)"
